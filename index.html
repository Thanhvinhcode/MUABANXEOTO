<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản Lý Nợ</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="light">

<div class="container">
<h2>💸 Quản Lý Nợ (Gọn)</h2>

<button class="theme" onclick="changeTheme()">🎨 Đổi màu</button>

<div class="section">
<h3>📉 Bạn nợ</h3>
<div class="form">
<input id="n1" placeholder="Tên">
<input id="m1" placeholder="Tiền" oninput="formatInput(this)">
<button class="add" onclick="add('debt')">Thêm</button>
</div>
<table>
<thead><tr><th>Tên</th><th>Số tiền</th><th></th></tr></thead>
<tbody id="list1"></tbody>
</table>
<div class="total" id="total1"></div>
</div>

<div class="section">
<h3>📈 Người khác nợ</h3>
<div class="form">
<input id="n2" placeholder="Tên">
<input id="m2" placeholder="Tiền" oninput="formatInput(this)">
<button class="add" onclick="add('loan')">Thêm</button>
</div>
<table>
<thead><tr><th>Tên</th><th>Số tiền</th><th></th></tr></thead>
<tbody id="list2"></tbody>
</table>
<div class="total" id="total2"></div>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
